name: Build Windows Installer Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build QuickConvertSetup.exe
        run: python build_installer.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickConvertSetup-Windows
          path: dist/QuickConvertSetup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuickConvertSetup.exe
          generate_release_notes: true
